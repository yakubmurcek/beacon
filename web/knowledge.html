  <main class="wrap" id="main">
    <div class="kn-bar">
      <nav class="kn-views" id="views" aria-label="Knowledge views">
        <a href="#/" data-view="search">Graph</a>
        <a href="#/notes" data-view="notes">Notes <span class="count" id="notes-count"></span></a>
        <a href="#/calls" data-view="calls">Calls <span class="count" id="calls-count"></span></a>
      </nav>
      <form class="kn-search" id="form" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

      </form>
    </div>
    <p class="error" id="error" hidden></p>
    <section id="view" aria-live="polite"></section>
