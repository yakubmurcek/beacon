name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA (a tag can be moved to other code; a SHA cannot). Dependabot bumps them.
jobs:
  check:
    name: check (tools, lint, ratchets, types, copy-paste, tests, coverage, layout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'  # npm 11: the 7-day release cooldown in .npmrc
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      # The same command the pre-push hook runs; compared with the commit before this push (or the PR base).
      - run: scripts/check
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  check-ts:
    name: check-ts (TypeScript workspace - types, lint, format, dead code, tests, coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the copy tools' round trip (ts/packages/db/test/roundtrip.pg.test.ts); throwaway, trust auth.
    services:
      postgres:
        image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b  # 18, 2026-11-24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      BEACON_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - run: scripts/check-ts

  release-ts:
    name: release-ts (one tarball of the TypeScript app per green main commit, for the hub server's deploy timer)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, check-ts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: scripts/release-ts
        env:
          BEACON_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: beacon-release
          path: beacon-*.tar.gz*
          retention-days: 14
          if-no-files-found: error

  supply-chain:
    name: supply chain (osv-scanner on the lockfiles, gitleaks on the history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/supply-chain
