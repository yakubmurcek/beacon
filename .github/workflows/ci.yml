name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint, quality ratchet, copy-paste, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
      # The same command the pre-push hook runs; compared with the commit before this push (or the PR base).
      - run: scripts/check
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
