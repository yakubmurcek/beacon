# The strict rule set new code must meet. Old code is held by scripts/ratchet.py (quality-baseline.json):
# it may not get worse, and every fix lowers the baseline for good. `ruff.toml` stays the zero-tolerance set.
extend = "ruff.toml"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "PLR09", "PLW", "RUF", "S"]
# subprocess calls with fixed argument lists and pseudo-random jitter are how this repo works, not risks
ignore = ["S603", "S607", "S404", "S311"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-args = 6
max-branches = 15
max-statements = 60
max-returns = 8
